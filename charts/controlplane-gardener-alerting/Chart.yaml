apiVersion: v2
name: controlplane-gardener-alerting
version: 0.1.0
description: Integration between the Gardener Prometheus alerting and SCI alerting stack. Hosts alert rules that target Gardener Prometheus. Packaged into a separate chart (and plugin) because its deployment target differs from the controlplane-operations chart — scoped to runtime clusters where the Gardener operator runs.
