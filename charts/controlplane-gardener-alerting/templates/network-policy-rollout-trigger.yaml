{{- if and .Values.map.enabled .Values.map.rolloutTriggerJob.enabled }}
# The garden namespace has a deny-all NetworkPolicy (both ingress and egress).
# The rollout-trigger Job runs kubectl inside the cluster; it needs egress to the
# Kubernetes API server to patch the prometheus/garden CR. This policy opens that
# egress path for the Job pod only.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-from-map-rollout-trigger-to-apiserver
  namespace: garden
spec:
  podSelector:
    matchLabels:
      app: map-rollout-trigger
  policyTypes:
  - Egress
  egress:
  - ports:
    - port: 443
      protocol: TCP
{{- end }}
