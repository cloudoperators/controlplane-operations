{{- if .Values.map.enabled }}
# Alert relabeling for prometheus/garden.
#
# Referenced by the gardener-prometheus-sci-routing MutatingAdmissionPolicy as
# spec.additionalAlertRelabelConfigs. Sets support_group=containers, constructs
# a playbook URL from the lowercased alertname, and downgrades critical severity
# to warning while the alerting path is being validated.
#
# externalLabels (cluster/cluster_type/region) are carried by the MAP mutation,
# not this Secret.
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.map.relabel.secretName }}
  namespace: garden
type: Opaque
stringData:
  {{ .Values.map.relabel.key }}: |
    - source_labels: [support_group]
      target_label: support_group
      replacement: containers
      action: replace
    # playbook = lowercased alertname, then prefixed with the playbook base URL.
    # Two steps: doc filenames are lowercase, so skipping the lowercase step
    # yields 404s (issue #1305 / problem #4).
    - source_labels: [alertname]
      target_label: playbook
      action: lowercase
    - source_labels: [playbook]
      target_label: playbook
      replacement: {{ .Values.map.relabel.playbookBaseURL }}/$1
      action: replace
    # severity downgrade — remove once the alert path is validated (#1521).
    - source_labels: [severity]
      regex: critical
      target_label: severity
      replacement: warning
      action: replace
{{- end }}
