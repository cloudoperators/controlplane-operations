{{- if .Values.map.enabled }}
# External SCI Alertmanager send path for prometheus/garden.
#
# Two Secrets in the `garden` namespace, referenced by the
# gardener-prometheus-sci-routing MutatingAdmissionPolicy:
#
#   1. tls-prometheus-garden-sci     — mTLS client cert, mounted into the
#      Prometheus pod via spec.secrets (the MAP appends the name) at
#      /etc/prometheus/secrets/tls-prometheus-garden-sci/.
#   2. alertmanager-garden-sci-config — the additionalAlertManagerConfigs payload
#      (Prometheus alertmanager_config entries), appended to prometheus.yml.
#
# The cert reuses the same Vault SSO material the metrics-gardener ThanosRuler
# used; vault+kvv2 refs are resolved at deploy time (vault_enabled pipeline).
---
apiVersion: v1
kind: Secret
metadata:
  name: tls-prometheus-garden-sci
  namespace: garden
type: Opaque
stringData:
  tls.crt: vault+kvv2:///secrets/shared/shared/prometheus-auth/sso/certificate
  tls.key: vault+kvv2:///secrets/shared/shared/prometheus-auth/sso/private-key
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.map.alertManager.secretName }}
  namespace: garden
type: Opaque
stringData:
  {{ .Values.map.alertManager.key }}: |
    - api_version: v2
      scheme: https
      timeout: 10s
      tls_config:
        cert_file: /etc/prometheus/secrets/tls-prometheus-garden-sci/tls.crt
        key_file: /etc/prometheus/secrets/tls-prometheus-garden-sci/tls.key
      static_configs:
      - targets:
        {{- range .Values.map.alertManager.targets }}
        - {{ . }}
        {{- end }}
{{- end }}
