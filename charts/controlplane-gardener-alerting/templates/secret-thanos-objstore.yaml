{{- if and .Values.map.enabled .Values.objectStorage.enabled }}
# Thanos objstore config for the Garden Prometheus sidecar.
# Referenced by the gardener-prometheus-thanos-objstore MAP via objectStorageConfig.
# Set objectStorage.config in GitOps values.
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.objectStorage.secretName }}
  namespace: garden
type: Opaque
stringData:
  {{ .Values.objectStorage.secretKey }}: |
    {{- .Values.objectStorage.config | nindent 4 }}
{{- end }}
