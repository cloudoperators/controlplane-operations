# controlplane-gardener-alerting — values

map:
  # -- Enable the MutatingAdmissionPolicy that injects SCI alerting config into
  # the Garden Prometheus CR (garden/garden) on the runtime cluster.
  enabled: false

  rolloutTriggerJob:
    # -- Deploy the post-install/post-upgrade trigger Job that activates the MAP
    # by patching an annotation onto prometheus/garden. ONE-TIME USE: set to false
    # once the MAP rollout is complete.
    enabled: true

  externalLabels:
    # -- cluster, region, cluster_type are merged into prometheus/garden
    # spec.externalLabels by the MAP. Gardener's own labels (e.g. landscape) are
    # preserved. Must be set per deployment target.
    cluster: ""
    region: ""
    cluster_type: ""
    # -- Stable discriminator identifying the garden-Prometheus alert source at
    # the SCI Alertmanager (dedup/routing during the metrics-gardener dual-run).
    # Survives relabeling and outlives metrics-gardener.
    alert_source: garden-prometheus

  thanos:
    # -- Thanos sidecar image tag. Matches kube-prometheus-stack default.
    # Update when bumping the kube-monitoring chart.
    version: v0.42.4

  kubectl:
    # -- kubectl image tag for the rollout trigger Job.
    # Pin to match the runtime cluster's Kubernetes version.
    version: v1.34.8

  alertManager:
    # -- Secret name and key for spec.additionalAlertManagerConfigs.
    secretName: alertmanager-garden-sci-config
    key: alertmanagers.yaml
    # -- SCI central Alertmanager targets (list of hostnames).
    targets:
      - alertmanager-internal.scaleout.eu-de-1.cloud.sap
      - alertmanager-internal.scaleout.eu-nl-1.cloud.sap

  relabel:
    # -- Secret name and key for spec.additionalAlertRelabelConfigs.
    secretName: alert-relabel-configs
    key: config.yaml
    # -- Base URL for playbook links. Alertname (lowercased) is appended as the
    # final path segment.
    playbookBaseURL: https://operations.global.cloud.sap/docs/container/kubernetes/gardener
