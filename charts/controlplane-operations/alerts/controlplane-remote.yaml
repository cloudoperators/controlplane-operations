groups:
- name: controlplane-remote
  rules:
{{- if not (.Values.prometheusRules.disabled.ArgoraUpdateInError | default false) }}
  - alert: ArgoraUpdateInError
    expr: >
      kube_customresource_status_state{customresource_kind="Update",customresource_group="argora.cloud.sap",state=~"Error"}
      == 1
    for: {{ dig "ArgoraUpdateInError" "for" "10m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "ArgoraUpdateInError" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/argora-update-in-error/ #TODO: add playbook
      service: {{ dig "ArgoraUpdateInError" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "ArgoraUpdateInError" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      description: Argora Update CR status is in Error state for more than {{ dig "ArgoraUpdateInError" "for" "10m" .Values.prometheusRules }} minutes.
      summary: Update CR in Error state.
{{- end }}

{{- if not (.Values.prometheusRules.disabled.ArgoraClusterImportInError | default false) }}
  - alert: ArgoraClusterImportInError
    expr: >
      kube_customresource_status_state{customresource_kind="ClusterImport",customresource_group="argora.cloud.sap",state=~"Error"}
      == 1
    for: {{ dig "ArgoraClusterImportInError" "for" "10m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "ArgoraClusterImportInError" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/argora-clusterimport-in-error/ #TODO: add playbook
      service: {{ dig "ArgoraClusterImportInError" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "ArgoraClusterImportInError" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      description: Argora ClusterImport CR status is in Error state for more than {{ dig "ArgoraClusterImportInError" "for" "10m" .Values.prometheusRules }} minutes.
      summary: ClusterImport CR in Error state.
{{- end }}

{{- if not (.Values.prometheusRules.disabled.ArgoraPodNotReadyError | default false) }}
  - alert: ArgoraPodNotReadyError
    expr: >
      kube_pod_status_ready{pod=~"argora-controller-manager-.+",condition="true"} == 0
    for: {{ dig "ArgoraPodNotReadyError" "for" "5m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "ArgoraPodNotReadyError" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/argora-pod-not-ready/ #TODO: add playbook
      service: {{ dig "ArgoraPodNotReadyError" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "ArgoraPodNotReadyError" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      description: Argora Pod is not ready for more than {{ dig "ArgoraPodNotReadyError" "for" "5m" .Values.prometheusRules }} minutes.
      summary: Pod not ready.
{{- end }}

{{- if not (.Values.prometheusRules.disabled.ServerStuckInDiscovery | default false) }}
  - alert: ServerStuckInDiscovery
    expr: >
      kube_customresource_status_state{customresource_kind="Server",customresource_group="metal.ironcore.dev",state=~"Discovery"}
      == 1
    for: {{ dig "ServerStuckInDiscovery" "for" "15m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "ServerStuckInDiscovery" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/server-stuck-in-discovery/ #TODO: add playbook
      service: {{ dig "ServerStuckInDiscovery" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "ServerStuckInDiscovery" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      description: Server is stuck in Discovery for more than {{ dig "ServerStuckInDiscovery" "for" "15m" .Values.prometheusRules }} minutes.
      summary: Server stuck in Discovery.
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookCertificateNearExpiry | default false) }}
  - alert: WebhookCertificateNearExpiry
    expr: |
      (webhook_injector_certificate_expiry_time_seconds - time()) < (90 * 24 * 3600 * 0.2)
    for: {{ dig "WebhookCertificateNearExpiry" "for" "5m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookCertificateNearExpiry" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-certificate-near-expiry/ #TODO: add playbook
      service: {{ dig "WebhookCertificateNearExpiry" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookCertificateNearExpiry" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "Webhook certificate is below rotation threshold."
      description: "Certificate expires soon, rotation should have happened since it's below threshold."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookCertificateAboutToExpire | default false) }}
  - alert: WebhookCertificateAboutToExpire
    expr: |
      (webhook_injector_certificate_expiry_time_seconds - time()) < (3 * 24 * 3600)
    for: {{ dig "WebhookCertificateAboutToExpire" "for" "5m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookCertificateAboutToExpire" "severity" "critical" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-certificate-about-to-expire/ #TODO: add playbook
      service: {{ dig "WebhookCertificateAboutToExpire" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookCertificateAboutToExpire" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "Webhook certificate is about to expire."
      description: "Certificate expires in less than 3 days."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookTargetStampErrors | default false) }}
  - alert: WebhookTargetStampErrors
    expr: |
      sum by (namespace, kind) (rate(webhook_injector_target_stamps_total{result="error"}[5m])) > 0
    for: {{ dig "WebhookTargetStampErrors" "for" "10m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookTargetStampErrors" "severity" "critical" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-target-stamp-errors/ #TODO: add playbook
      service: {{ dig "WebhookTargetStampErrors" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookTargetStampErrors" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "{{`{{ $labels.kind }}`}} apply to shoot {{`{{ $labels.namespace }}`}} is failing."
      description: "webhook-injector failed to apply {{`{{ $labels.kind }}`}} to the target cluster of shoot {{`{{ $labels.namespace }}`}}. The freshly rotated caBundle is NOT reaching the admission webhooks on that shoot and subsequent CR writes may be rejected with TLS errors."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookManagedResourceStampErrors | default false) }}
  - alert: WebhookManagedResourceStampErrors
    expr: |
      sum by (namespace) (rate(webhook_injector_managed_resource_stamps_total{result="error"}[5m])) > 0
    for: {{ dig "WebhookManagedResourceStampErrors" "for" "10m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookManagedResourceStampErrors" "severity" "critical" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-managed-resource-stamp-errors/ #TODO: add playbook
      service: {{ dig "WebhookManagedResourceStampErrors" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookManagedResourceStampErrors" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "ManagedResource Secret caBundle stamp is failing on shoot {{`{{ $labels.namespace }}`}}."
      description: "webhook-injector failed to stamp the freshly rotated caBundle onto a labeled ManagedResource Secret in namespace {{`{{ $labels.namespace }}`}}. The embedded CRDs will not refresh in the shoot via gardener-resource-manager, and conversion webhooks for those CRDs will fail TLS once the old cert is pruned. Check the webhook-injector logs in namespace {{`{{ $labels.namespace }}`}} for the offending MR name."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookManagedResourceUnhealthy | default false) }}
  - alert: WebhookManagedResourceUnhealthy
    expr: |
      sum by (namespace, condition, status) (rate(webhook_injector_managed_resource_unhealthy_total[5m])) > 0
    for: {{ dig "WebhookManagedResourceUnhealthy" "for" "15m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookManagedResourceUnhealthy" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-managed-resource-unhealthy/ #TODO: add playbook
      service: {{ dig "WebhookManagedResourceUnhealthy" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookManagedResourceUnhealthy" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "ManagedResource on shoot {{`{{ $labels.namespace }}`}} is unhealthy ({{`{{ $labels.condition }}`}}={{`{{ $labels.status }}`}})."
      description: "A labeled ManagedResource in namespace {{`{{ $labels.namespace }}`}} has condition {{`{{ $labels.condition }}`}} with status {{`{{ $labels.status }}`}} (expected True). gardener-resource-manager is unable to apply or keep the resources healthy in the shoot, so caBundle propagation to shoot-side CRDs is degraded. Check the MR's status conditions for Reason/Message and the webhook-injector logs in namespace {{`{{ $labels.namespace }}`}} for the affected MR name."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookManagedResourceKeepObjectsViolation | default false) }}
  - alert: WebhookManagedResourceKeepObjectsViolation
    expr: |
      sum by (namespace) (rate(webhook_injector_managed_resource_keep_objects_violations_total[5m])) > 0
    for: {{ dig "WebhookManagedResourceKeepObjectsViolation" "for" "15m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookManagedResourceKeepObjectsViolation" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-managed-resource-keep-objects-violation/ #TODO: add playbook
      service: {{ dig "WebhookManagedResourceKeepObjectsViolation" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookManagedResourceKeepObjectsViolation" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "ManagedResource on shoot {{`{{ $labels.namespace }}`}} ships CRDs without spec.keepObjects=true."
      description: "A labeled ManagedResource in namespace {{`{{ $labels.namespace }}`}} ships at least one CRD but does not set spec.keepObjects=true. Deleting that MR (intentionally or accidentally) would cascade-delete the shoot-side CRDs and every custom resource of those kinds. Fix by setting spec.keepObjects=true on the MR — the stamp still works either way, but the destructive shape needs to be addressed. Check the webhook-injector logs in namespace {{`{{ $labels.namespace }}`}} for the offending MR name."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookManagedResourceForceReconcilePatchErrors | default false) }}
  - alert: WebhookManagedResourceForceReconcilePatchErrors
    expr: |
      sum by (namespace) (rate(webhook_injector_managed_resource_force_reconcile_total{result="error"}[5m])) > 0
    for: {{ dig "WebhookManagedResourceForceReconcilePatchErrors" "for" "15m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookManagedResourceForceReconcilePatchErrors" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-managed-resource-force-reconcile-patch-errors/ #TODO: add playbook
      service: {{ dig "WebhookManagedResourceForceReconcilePatchErrors" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookManagedResourceForceReconcilePatchErrors" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "gardener.cloud/operation=reconcile patch failing on shoot {{`{{ $labels.namespace }}`}}."
      description: "webhook-injector stamped a ManagedResource Secret in namespace {{`{{ $labels.namespace }}`}} but failed to patch the gardener.cloud/operation=reconcile annotation on the parent MR. gardener-resource-manager may take up to its own watch/sync interval to notice the change rather than reconciling immediately — caBundle propagation to the shoot will still happen, but with extra latency. Check the webhook-injector logs in namespace {{`{{ $labels.namespace }}`}} for the affected MR name."
{{- end }}

{{- if not (.Values.prometheusRules.disabled.WebhookCertificateRotationDeferredByUnhealthyMRs | default false) }}
  - alert: WebhookCertificateRotationDeferredByUnhealthyMRs
    expr: |
      sum by (namespace) (rate(webhook_injector_certificate_rotation_deferred_unhealthy_mrs_total[5m])) > 0
    for: {{ dig "WebhookCertificateRotationDeferredByUnhealthyMRs" "for" "15m" .Values.prometheusRules }}
    labels:
      {{ include "controlplane-operations.additionalRuleLabels" . }}
      severity: {{ dig "WebhookCertificateRotationDeferredByUnhealthyMRs" "severity" "warning" .Values.prometheusRules }}
      playbook: https://operations.global.cloud.sap/docs/support/playbook/webhook-certificate-rotation-deferred-by-unhealthy-mrs/ #TODO: add playbook
      service: {{ dig "WebhookCertificateRotationDeferredByUnhealthyMRs" "service" .Values.prometheusRules.defaultService .Values.prometheusRules }}
      support_group: {{ dig "WebhookCertificateRotationDeferredByUnhealthyMRs" "support_group" .Values.prometheusRules.defaultSupportGroup .Values.prometheusRules }}
    annotations:
      summary: "Certificate rotation on shoot {{`{{ $labels.namespace }}`}} is being held back by unhealthy ManagedResources."
      description: "webhook-injector observed a non-force certificate rotation reason (expired/san_mismatch/etc.) on shoot {{`{{ $labels.namespace }}`}} but is deferring the rotation because at least one labeled ManagedResource has ResourcesApplied or ResourcesHealthy != True. The existing cert keeps being served; rotation will resume automatically when the MR(s) recover. If the cert reaches NotAfter before that happens, the rotation will proceed anyway with a louder warning log — but webhook calls on shoot-side CRDs may TLS-fail during the gap. Check the webhook-injector logs in namespace {{`{{ $labels.namespace }}`}} for the offending MR names, and the GRM/MR status for the underlying cause."
{{- end }}
